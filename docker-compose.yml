version: '3.8'

services:
  megamaps:
    build: .
    container_name: megamaps
    restart: always  # ← ESTO ES LO CRÍTICO: reinicia automáticamente
    ports:
      - "8080:80"  # Cambia 8080 por el puerto que prefieras
    environment:
      - MEGAMAPS_DATA_DIR=/data
      - MEGAMAPS_ADMIN_PIN=${MEGAMAPS_ADMIN_PIN:-cambia-esta-clave}
    volumes:
      - megamaps-data:/data  # Volumen persistente para bases de datos y fotos
    healthcheck:
      test: ["CMD", "php", "-r", "$$r=@file_get_contents('http://127.0.0.1/backend/api.php?action=health'); exit($$r !== false && strpos($$r, '\"status\":\"ok\"') !== false ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  megamaps-data:
    driver: local

# Notas:
# 1. "restart: always" garantiza que el contenedor se reinicie automáticamente
#    después de un apagado del servidor o si el contenedor falla
#
# 2. El volumen "megamaps-data" persiste los datos entre reinicios:
#    - Bases de datos SQLite
#    - Fotos subidas por los usuarios
#    - Configuración de administración
#
# 3. Cambia MEGAMAPS_ADMIN_PIN en el archivo .env o directamente aquí
#    (no uses el valor por defecto "cambia-esta-clave")
#
# 4. Para usar en EasyPanel:
#    - Configura "Restart Policy" como "Always"
#    - Crea un volumen montado en /data
#    - Configura las variables de entorno
