; Configuración personalizada para MegaMaps
; Permitir subidas de archivos grandes sin límites

upload_max_filesize = 0
post_max_size = 0
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
file_uploads = On

; Configuración de seguridad
display_errors = Off
log_errors = On
error_log = error.log

; Configuración de sesiones
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
