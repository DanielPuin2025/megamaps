; Configuración local para MegaMaps. iniciar.bat carga las extensiones requeridas.

upload_max_filesize = 6M
post_max_size = 7M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
file_uploads = On

display_errors = Off
log_errors = On
error_log = error.log

session.cookie_httponly = 1
session.use_strict_mode = 1
