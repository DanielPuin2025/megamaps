RedirectMatch ^/$ /frontend/index.html

Alias /fotos/ /data/fotos/

# Las bases de datos nunca se sirven por web, sin importar la ruta
# (incluida "base de datos/", que es un enlace a /data).
<FilesMatch "\.(sqlite[^/]*|db|sql|py)$">
    Require all denied
</FilesMatch>

<Directory /data>
    Options -Indexes +FollowSymLinks -ExecCGI
    AllowOverride None
    Require all granted
</Directory>

<DirectoryMatch "^/(data|var/www/html/base de datos)/fotos(_rutas)?(/|$)">
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

<Directory /var/www/html/backend>
    Options -Indexes +FollowSymLinks
</Directory>
