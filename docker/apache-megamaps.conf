RedirectMatch ^/$ /frontend/index.html

Alias /fotos/ /data/fotos/

<Directory /data>
    Options -Indexes +FollowSymLinks -ExecCGI
    AllowOverride None
    Require all granted

    # La base de datos y cualquier script nunca se sirven por web.
    <FilesMatch "\.(php|sqlite[^/]*|sql|db|json|py)$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/html/backend>
    Options -Indexes +FollowSymLinks
</Directory>
